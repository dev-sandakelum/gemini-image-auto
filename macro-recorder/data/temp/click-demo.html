<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Macro Click Demo</title>
<style>
  :root {
    --bg:       #0a0d12;
    --panel:    #12161d;
    --raised:   #191f29;
    --border:   #262e3a;
    --border-lt:#333d4c;
    --text:     #e7ecf3;
    --muted:    #7c8896;
    --dim:      #4b5563;
    --accent:   #58a6ff;
    --mono: 'SF Mono', 'Cascadia Code', Consolas, monospace;
    --sans: -apple-system, 'Segoe UI', system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 28px 16px;
  }

  .window {
    width: 100%;
    max-width: 1040px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 30px 60px -20px rgba(0,0,0,0.6);
  }

  /* ── title bar ── */
  .titlebar {
    display: flex; align-items: center; gap: 10px;
    padding: 11px 14px;
    background: var(--raised);
    border-bottom: 1px solid var(--border);
  }
  .dots { display: flex; gap: 6px; margin-right: 4px; }
  .dots span { width: 10px; height: 10px; border-radius: 50%; background: #333c48; }
  .titlebar-name { font-size: .82rem; font-weight: 600; color: var(--text); }
  .titlebar-sub { font-size: .74rem; color: var(--dim); font-family: var(--mono); }
  .titlebar-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
  .res-tag {
    font-family: var(--mono); font-size: .7rem; color: var(--muted);
    border: 1px solid var(--border-lt); padding: 2px 7px; border-radius: 4px;
  }

  /* ── macro tabs ── */
  .tabbar {
    display: flex; gap: 2px; padding: 0 8px;
    background: var(--raised);
    border-bottom: 1px solid var(--border);
    overflow-x: auto;
  }
  .tab {
    padding: 9px 14px 8px; cursor: pointer; user-select: none;
    font-size: .8rem; font-weight: 600; color: var(--muted);
    border-bottom: 2px solid transparent;
    white-space: nowrap;
    transition: color .15s, border-color .15s;
  }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--tab-color, var(--text)); border-color: var(--tab-color, var(--accent)); }

  /* ── stage: canvas + floating HUD ── */
  .stage {
    position: relative;
    width: 100%;
    background: #05070a;
    border-bottom: 1px solid var(--border);
  }
  .stage-ratio { padding-top: 56.25%; }
  canvas#screen { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  .hud {
    position: absolute; top: 12px; left: 12px; right: 12px;
    display: flex; justify-content: space-between; align-items: flex-start;
    pointer-events: none;
  }
  .hud-chip {
    font-family: var(--mono); font-size: .72rem;
    background: rgba(10,13,18,0.72); backdrop-filter: blur(6px);
    border: 1px solid var(--border-lt);
    border-radius: 6px; padding: 5px 9px;
    color: var(--muted);
  }
  .hud-chip b { color: var(--text); font-weight: 600; }
  .hud-step {
    display: flex; flex-direction: column; align-items: flex-end; gap: 4px;
  }

  .map-toggle {
    position: absolute; bottom: 12px; right: 12px;
    pointer-events: auto;
    font-family: var(--mono); font-size: .7rem;
    background: rgba(10,13,18,0.72); backdrop-filter: blur(6px);
    border: 1px solid var(--border-lt); color: var(--muted);
    border-radius: 6px; padding: 5px 10px; cursor: pointer;
    transition: color .15s, border-color .15s;
  }
  .map-toggle:hover { color: var(--text); border-color: var(--accent); }
  .map-toggle.on { color: var(--accent); border-color: var(--accent); }

  /* ── scrub / progress rail ── */
  .rail {
    padding: 12px 16px 10px;
    border-bottom: 1px solid var(--border);
  }
  .rail-track {
    position: relative;
    height: 4px; border-radius: 2px; background: var(--border);
    cursor: pointer;
  }
  .rail-fill {
    position: absolute; top: 0; left: 0; height: 100%;
    border-radius: 2px; background: var(--tab-color, var(--accent));
    transition: width .12s;
  }
  .rail-ticks { position: absolute; inset: 0; }
  .rail-tick {
    position: absolute; top: -3px;
    width: 2px; height: 10px; border-radius: 1px;
    background: var(--dim); transform: translateX(-1px);
    cursor: pointer;
  }
  .rail-tick.mouse { background: var(--border-lt); }
  .rail-tick.active { background: #fff; height: 14px; top: -5px; }
  .rail-labels {
    display: flex; justify-content: space-between;
    margin-top: 8px; font-family: var(--mono); font-size: .72rem; color: var(--dim);
  }

  /* ── transport controls ── */
  .transport {
    display: flex; align-items: center; gap: 8px;
    padding: 12px 16px;
  }
  button {
    display: flex; align-items: center; justify-content: center;
    padding: 7px 12px; border-radius: 7px; border: 1px solid var(--border-lt);
    background: var(--raised); color: var(--text); cursor: pointer;
    font-size: .8rem; font-weight: 600; font-family: var(--sans);
    transition: background .15s, border-color .15s;
  }
  button:hover { background: #212936; border-color: #414d5e; }
  button:active { background: #1a212b; }
  #btnPlay { min-width: 76px; }
  .icon-btn { padding: 7px 10px; }
  .transport-gap { flex: 1; }
  .speed-group {
    display: flex; align-items: center; gap: 8px;
    font-size: .78rem; color: var(--muted);
  }
  input[type=range] { accent-color: var(--accent); cursor: pointer; width: 90px; }
  .speed-val { font-family: var(--mono); color: var(--text); min-width: 30px; }

  /* ── divider ── */
  .divider { height: 1px; background: var(--border); }

  /* ── detail strip ── */
  .detail {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    border-bottom: 1px solid var(--border);
  }
  .detail-cell {
    padding: 10px 16px;
    border-right: 1px solid var(--border);
  }
  .detail-cell:last-child { border-right: none; }
  .detail-label {
    font-size: .66rem; letter-spacing: .05em; color: var(--dim);
    margin-bottom: 3px;
  }
  .detail-value {
    font-family: var(--mono); font-size: .84rem; font-weight: 600; color: var(--text);
  }

  /* ── footer ── */
  .footer {
    display: flex; align-items: center; justify-content: space-between;
    padding: 9px 16px;
    font-size: .72rem; color: var(--dim);
  }
  .footer kbd {
    font-family: var(--mono); background: var(--raised); border: 1px solid var(--border-lt);
    border-radius: 4px; padding: 1px 5px; color: var(--muted); font-size: .7rem;
  }
  .footer-keys { display: flex; gap: 14px; align-items: center; }

  @media (max-width: 600px) {
    .detail { grid-template-columns: repeat(2, 1fr); }
    .detail-cell:nth-child(2) { border-right: none; }
    .detail-cell:nth-child(n+3) { border-top: 1px solid var(--border); }
    .footer-keys { display: none; }
    .hud-chip { font-size: .66rem; }
  }
</style>
</head>
<body>

<div class="window">

  <!-- title bar -->
  <div class="titlebar">
    <div class="dots"><span></span><span></span><span></span></div>
    <span class="titlebar-name">Macro Click Viewer</span>
    <span class="titlebar-sub" id="titlebarSub">—</span>
    <div class="titlebar-right">
      <span class="res-tag">1920×1080</span>
    </div>
  </div>

  <!-- macro tabs -->
  <div class="tabbar" id="tabs"></div>

  <!-- stage -->
  <div class="stage">
    <div class="stage-ratio"></div>
    <canvas id="screen"></canvas>
    <div class="hud">
      <div class="hud-chip" id="hudType">—</div>
      <div class="hud-step">
        <div class="hud-chip"><b id="hudStep">—</b></div>
      </div>
    </div>
    <div class="map-toggle" id="mapToggle">⊞ all macros</div>
  </div>

  <!-- scrub rail -->
  <div class="rail">
    <div class="rail-track" id="railTrack">
      <div class="rail-fill" id="railFill"></div>
      <div class="rail-ticks" id="railTicks"></div>
    </div>
    <div class="rail-labels">
      <span id="railStart">step 1</span>
      <span id="railEnd">—</span>
    </div>
  </div>

  <!-- transport -->
  <div class="transport">
    <button class="icon-btn" id="btnReset" title="Reset (R)">↺</button>
    <button class="icon-btn" id="btnPrev" title="Previous (←)">◀</button>
    <button id="btnPlay" title="Play/Pause (Space)">▶ Play</button>
    <button class="icon-btn" id="btnNext" title="Next (→)">▶</button>
    <div class="transport-gap"></div>
    <div class="speed-group">
      <span>Speed</span>
      <input type="range" id="speedRange" min="0.25" max="4" step="0.25" value="1"/>
      <span class="speed-val" id="speedVal">1×</span>
    </div>
  </div>

  <div class="divider"></div>

  <!-- detail strip -->
  <div class="detail">
    <div class="detail-cell">
      <div class="detail-label">TYPE</div>
      <div class="detail-value" id="infoType">—</div>
    </div>
    <div class="detail-cell">
      <div class="detail-label">POSITION</div>
      <div class="detail-value" id="infoPos">—</div>
    </div>
    <div class="detail-cell">
      <div class="detail-label">HOLD</div>
      <div class="detail-value" id="infoHold">—</div>
    </div>
    <div class="detail-cell">
      <div class="detail-label">MACRO</div>
      <div class="detail-value" id="infoMacro">—</div>
    </div>
  </div>

  <!-- footer -->
  <div class="footer">
    <span id="footerNote">Click a tick on the rail to jump to that step</span>
    <div class="footer-keys">
      <span><kbd>space</kbd> play</span>
      <span><kbd>←</kbd> <kbd>→</kbd> step</span>
      <span><kbd>1</kbd>–<kbd>5</kbd> macro</span>
      <span><kbd>r</kbd> reset</span>
    </div>
  </div>

</div>

<script>
// ─── macro data ───────────────────────────────────────────────────────────────
const MACROS = [
  {
    name: "1 · add_prompt", color: "#58a6ff",
    actions: [
      { type:"mouse", action:"click", button:"left",  x:641,  y:967,  holdMs:160 },
      { type:"wait",  duration:200 },
      { type:"mouse", action:"click", button:"left",  x:357,  y:921,  holdMs:160 },
      { type:"wait",  duration:200 },
      { type:"mouse", action:"click", button:"left",  x:357,  y:921,  holdMs:160 },
      { type:"wait",  duration:200 },
      { type:"mouse", action:"click", button:"left",  x:357,  y:921,  holdMs:160 },
      { type:"wait",  duration:200 },
      { type:"keyboard", action:"hotkey", label:"Ctrl+V" },
      { type:"wait",  duration:900 },
      { type:"mouse", action:"click", button:"left",  x:996,  y:911,  holdMs:120 },
      { type:"wait",  duration:20000 },
      { type:"wait",  duration:1600 },
      { type:"mouse", action:"click", button:"left",  x:796,  y:965,  holdMs:160 },
      { type:"wait",  duration:100 },
    ]
  },
  {
    name: "2 · download_image", color: "#3fb950",
    actions: [
      { type:"mouse", action:"click", button:"left",  x:141,  y:450,  holdMs:160 },
      { type:"keyboard", action:"hotkey", label:"End" },
      { type:"wait",  duration:400 },
      { type:"keyboard", action:"hotkey", label:"End" },
      { type:"keyboard", action:"hotkey", label:"End" },
      { type:"mouse", action:"click", button:"right", x:320,  y:556,  holdMs:160 },
      { type:"wait",  duration:200 },
      { type:"mouse", action:"click", button:"left",  x:379,  y:633,  holdMs:160 },
      { type:"wait",  duration:1600 },
      { type:"mouse", action:"click", button:"left",  x:600,  y:585,  holdMs:160 },
    ]
  },
  {
    name: "3 · next", color: "#d29922",
    actions: [
      { type:"wait",  duration:1600 },
      { type:"mouse", action:"click", button:"left",  x:796,  y:965,  holdMs:160 },
      { type:"wait",  duration:100 },
    ]
  },
  {
    name: "4 · exit", color: "#f85149",
    actions: [
      { type:"mouse", action:"click", button:"left",  x:1077, y:881,  holdMs:160 },
      { type:"wait",  duration:400 },
      { type:"keyboard", action:"hotkey", label:"End" },
      { type:"wait",  duration:400 },
    ]
  },
  {
    name: "5 · wait", color: "#bc8cff",
    actions: [
      { type:"wait",  duration:10000 },
      { type:"wait",  duration:1600 },
      { type:"mouse", action:"click", button:"left",  x:796,  y:965,  holdMs:160 },
      { type:"wait",  duration:100 },
    ]
  },
];

// ─── recorded resolution ──────────────────────────────────────────────────────
const RW = 1920, RH = 1080;

// ─── state ────────────────────────────────────────────────────────────────────
let activeMacro = 0;
let activeStep  = 0;
let playing     = false;
let playTimer   = null;
let speed       = 1;
let showAllMap  = false;

// ─── canvas refs ─────────────────────────────────────────────────────────────
const screenCanvas = document.getElementById("screen");
const ctx          = screenCanvas.getContext("2d");

// ─── ripple animations ────────────────────────────────────────────────────────
let ripples = [];

function addRipple(x, y, color) {
  ripples.push({ x, y, color, r: 0, maxR: 38, alpha: 1, t: Date.now() });
}

// ─── scale helpers ───────────────────────────────────────────────────────────
function sx(x) { return (x / RW) * screenCanvas.width; }
function sy(y) { return (y / RH) * screenCanvas.height; }

function drawGrid(W, H) {
  ctx.fillStyle = "#05070a";
  ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = "rgba(38,46,58,0.5)";
  ctx.lineWidth = 0.5;
  const gx = W / 16, gy = H / 9;
  for (let i = 0; i <= 16; i++) { ctx.beginPath(); ctx.moveTo(i*gx, 0); ctx.lineTo(i*gx, H); ctx.stroke(); }
  for (let j = 0; j <= 9;  j++) { ctx.beginPath(); ctx.moveTo(0, j*gy); ctx.lineTo(W, j*gy); ctx.stroke(); }
}

// ─── draw single-macro screen ─────────────────────────────────────────────────
function drawSingle() {
  const W = screenCanvas.width, H = screenCanvas.height;
  drawGrid(W, H);

  const macro   = MACROS[activeMacro];
  const actions = macro.actions;

  actions.forEach((act, i) => {
    if (act.type !== "mouse") return;
    const cx = sx(act.x), cy = sy(act.y);
    const isActive = (i === activeStep);
    const isPast   = (i < activeStep);

    ctx.beginPath();
    ctx.arc(cx, cy, isActive ? 12 : 7, 0, Math.PI * 2);
    ctx.fillStyle = macro.color;
    ctx.globalAlpha = isActive ? 1 : (isPast ? 0.28 : 0.15);
    ctx.fill();
    ctx.globalAlpha = 1;

    if (isActive || isPast) {
      ctx.fillStyle = isActive ? "#fff" : "rgba(255,255,255,0.45)";
      ctx.font = `bold ${Math.max(8, W * 0.009)}px monospace`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(String(i + 1), cx, cy);
    }

    if (isActive) {
      ctx.strokeStyle = macro.color;
      ctx.lineWidth = 1.5;
      ctx.globalAlpha = 0.6;
      ctx.beginPath(); ctx.moveTo(cx - 20, cy); ctx.lineTo(cx + 20, cy); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(cx, cy - 20); ctx.lineTo(cx, cy + 20); ctx.stroke();
      ctx.globalAlpha = 1;

      ctx.fillStyle = macro.color;
      ctx.font = `${Math.max(9, W*0.011)}px monospace`;
      ctx.textAlign = "left";
      ctx.textBaseline = "top";
      const lx = cx + 16, ly = cy - 8;
      ctx.fillText(`(${act.x}, ${act.y})`, lx, ly);
      ctx.fillText(`hold ${act.holdMs ?? 60}ms`, lx, ly + 14);
      ctx.fillText(act.button === "right" ? "RIGHT CLICK" : "LEFT CLICK", lx, ly + 28);
    }
  });

  const clicks = actions.filter(a => a.type === "mouse");
  if (clicks.length > 1) {
    ctx.strokeStyle = macro.color;
    ctx.lineWidth   = 1;
    ctx.globalAlpha = 0.2;
    ctx.setLineDash([4, 6]);
    ctx.beginPath();
    clicks.forEach((c, i) => {
      const px = sx(c.x), py = sy(c.y);
      i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
    });
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.globalAlpha = 1;
  }

  drawRipples(W, H);
}

// ─── draw all-macros overview ─────────────────────────────────────────────────
function drawAll() {
  const W = screenCanvas.width, H = screenCanvas.height;
  drawGrid(W, H);

  MACROS.forEach((macro, mi) => {
    const clicks = macro.actions.filter(a => a.type === "mouse");
    if (clicks.length > 1) {
      ctx.strokeStyle = macro.color;
      ctx.lineWidth   = 1;
      ctx.globalAlpha = mi === activeMacro ? 0.3 : 0.12;
      ctx.setLineDash([3,5]);
      ctx.beginPath();
      clicks.forEach((c, i) => {
        const px = sx(c.x), py = sy(c.y);
        i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
      });
      ctx.stroke();
      ctx.setLineDash([]);
    }
    clicks.forEach(c => {
      const px = sx(c.x), py = sy(c.y);
      ctx.beginPath();
      ctx.arc(px, py, mi === activeMacro ? 6 : 5, 0, Math.PI * 2);
      ctx.fillStyle  = macro.color;
      ctx.globalAlpha = (mi === activeMacro) ? 0.95 : 0.35;
      ctx.fill();
    });
    ctx.globalAlpha = 0.85;
    ctx.fillStyle  = macro.color;
    ctx.font = `${Math.max(9, W*0.0105)}px sans-serif`;
    ctx.textAlign  = "left";
    ctx.textBaseline = "top";
    if (clicks.length) {
      const first = clicks[0];
      ctx.fillText(macro.name, sx(first.x) + 8, sy(first.y) - 13);
    }
    ctx.globalAlpha = 1;
  });
}

function drawRipples(W, H) {
  const now = Date.now();
  ripples = ripples.filter(r => r.alpha > 0);
  ripples.forEach(r => {
    const age  = (now - r.t) / 600;
    r.r     = r.maxR * age;
    r.alpha = Math.max(0, 1 - age);
    ctx.beginPath();
    ctx.arc(sx(r.x), sy(r.y), r.r, 0, Math.PI * 2);
    ctx.strokeStyle = r.color;
    ctx.lineWidth   = 2;
    ctx.globalAlpha = r.alpha;
    ctx.stroke();
    ctx.globalAlpha = 1;
  });
  if (ripples.length > 0) requestAnimationFrame(drawScreen);
}

function drawScreen() {
  if (showAllMap) drawAll();
  else drawSingle();
}

// ─── resize canvas ────────────────────────────────────────────────────────────
function resizeCanvas() {
  const wrap = screenCanvas.parentElement;
  screenCanvas.width  = wrap.clientWidth;
  screenCanvas.height = wrap.clientHeight;
  drawScreen();
}

// ─── build tabs ───────────────────────────────────────────────────────────────
function buildTabs() {
  const container = document.getElementById("tabs");
  container.innerHTML = "";
  MACROS.forEach((m, i) => {
    const t = document.createElement("div");
    t.className = "tab" + (i === activeMacro ? " active" : "");
    t.textContent = m.name;
    t.style.setProperty("--tab-color", m.color);
    t.addEventListener("click", () => {
      stopPlay();
      activeMacro = i;
      activeStep  = 0;
      buildTabs();
      buildRail();
      updateStepInfo();
      drawScreen();
    });
    container.appendChild(t);
  });
}

// ─── build scrub rail ─────────────────────────────────────────────────────────
function buildRail() {
  const ticksWrap = document.getElementById("railTicks");
  ticksWrap.innerHTML = "";
  const macro = MACROS[activeMacro];
  const total = macro.actions.length;

  document.getElementById("railEnd").textContent = `step ${total}`;
  document.querySelector(".rail-track").style.setProperty("--tab-color", macro.color);

  macro.actions.forEach((act, i) => {
    const pct = total > 1 ? (i / (total - 1)) * 100 : 0;
    const tick = document.createElement("div");
    tick.className = "rail-tick" + (act.type === "mouse" ? " mouse" : "") + (i === activeStep ? " active" : "");
    tick.id = `tick-${i}`;
    tick.style.left = pct + "%";
    tick.title = act.type === "mouse" ? `${act.button} click (${act.x},${act.y})` :
                 act.type === "wait" ? `wait ${act.duration}ms` : (act.label || "key");
    tick.addEventListener("click", (e) => { e.stopPropagation(); stopPlay(); jumpTo(i); });
    ticksWrap.appendChild(tick);
  });
  updateRailFill();
}

function updateRailFill() {
  const macro = MACROS[activeMacro];
  const total = macro.actions.length;
  const pct = total > 1 ? (activeStep / (total - 1)) * 100 : 100;
  document.getElementById("railFill").style.width = pct + "%";
  document.querySelectorAll(".rail-tick").forEach(t => t.classList.remove("active"));
  const t = document.getElementById(`tick-${activeStep}`);
  if (t) t.classList.add("active");
}

// ─── step info ────────────────────────────────────────────────────────────────
function updateStepInfo() {
  const macro = MACROS[activeMacro];
  const act   = macro.actions[activeStep];
  const total = macro.actions.length;

  document.getElementById("infoMacro").textContent = macro.name;
  document.getElementById("hudStep").textContent  = `${activeStep + 1} / ${total}`;
  document.getElementById("titlebarSub").textContent = `${macro.name} — step ${activeStep + 1} of ${total}`;
  document.getElementById("railStart").textContent = `step ${activeStep + 1}`;

  if (!act) return;
  if (act.type === "mouse") {
    document.getElementById("infoType").textContent = `🖱 ${act.action} (${act.button})`;
    document.getElementById("infoPos").textContent  = `${act.x}, ${act.y}`;
    document.getElementById("infoHold").textContent = `${act.holdMs ?? 60} ms`;
    document.getElementById("hudType").innerHTML = `<b>${act.button === "right" ? "RIGHT" : "LEFT"} CLICK</b>`;
  } else if (act.type === "wait") {
    document.getElementById("infoType").textContent = `⏳ wait`;
    document.getElementById("infoPos").textContent  = `—`;
    document.getElementById("infoHold").textContent = `${act.duration} ms`;
    document.getElementById("hudType").innerHTML = `<b>WAIT</b> ${act.duration}ms`;
  } else {
    document.getElementById("infoType").textContent = `⌨ ${act.label || act.action}`;
    document.getElementById("infoPos").textContent  = `—`;
    document.getElementById("infoHold").textContent = `—`;
    document.getElementById("hudType").innerHTML = `<b>KEY</b> ${act.label || act.action}`;
  }

  updateRailFill();

  if (act.type === "mouse" && !showAllMap) {
    addRipple(act.x, act.y, act.button === "right" ? "#f85149" : macro.color);
    requestAnimationFrame(drawScreen);
  }
}

// ─── navigation ──────────────────────────────────────────────────────────────
function jumpTo(i) {
  const macro = MACROS[activeMacro];
  activeStep = Math.max(0, Math.min(i, macro.actions.length - 1));
  updateStepInfo();
  drawScreen();
}

function stepNext() { jumpTo(activeStep + 1); }
function stepPrev() { jumpTo(activeStep - 1); }

function reset() {
  stopPlay();
  activeStep = 0;
  ripples = [];
  updateStepInfo();
  drawScreen();
}

// ─── auto play ────────────────────────────────────────────────────────────────
function stopPlay() {
  playing = false;
  clearTimeout(playTimer);
  document.getElementById("btnPlay").textContent = "▶ Play";
}

function startPlay() {
  if (playing) { stopPlay(); return; }
  playing = true;
  document.getElementById("btnPlay").textContent = "⏸ Pause";
  scheduleNext();
}

function scheduleNext() {
  if (!playing) return;
  const macro = MACROS[activeMacro];
  const act   = macro.actions[activeStep];
  if (!act) { stopPlay(); return; }

  let waitMs = 0;
  if (act.type === "wait") {
    waitMs = Math.min(act.duration / speed, 3000);
  } else {
    waitMs = 400 / speed;
  }

  playTimer = setTimeout(() => {
    if (!playing) return;
    if (activeStep >= macro.actions.length - 1) {
      stopPlay();
      return;
    }
    stepNext();
    scheduleNext();
  }, waitMs);
}

// ─── map toggle ───────────────────────────────────────────────────────────────
function toggleMap() {
  showAllMap = !showAllMap;
  document.getElementById("mapToggle").classList.toggle("on", showAllMap);
  document.getElementById("mapToggle").textContent = showAllMap ? "⊞ this macro" : "⊞ all macros";
  drawScreen();
}

// ─── init ─────────────────────────────────────────────────────────────────────
document.getElementById("btnPlay").addEventListener("click", startPlay);
document.getElementById("btnNext").addEventListener("click", () => { stopPlay(); stepNext(); });
document.getElementById("btnPrev").addEventListener("click", () => { stopPlay(); stepPrev(); });
document.getElementById("btnReset").addEventListener("click", reset);
document.getElementById("mapToggle").addEventListener("click", toggleMap);
document.getElementById("speedRange").addEventListener("input", e => {
  speed = parseFloat(e.target.value);
  document.getElementById("speedVal").textContent = speed + "×";
});
document.getElementById("railTrack").addEventListener("click", (e) => {
  const rect = e.currentTarget.getBoundingClientRect();
  const pct  = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
  const macro = MACROS[activeMacro];
  const idx = Math.round(pct * (macro.actions.length - 1));
  stopPlay();
  jumpTo(idx);
});

window.addEventListener("resize", resizeCanvas);

document.addEventListener("keydown", e => {
  if (e.key === "ArrowRight") { stopPlay(); stepNext(); }
  if (e.key === "ArrowLeft")  { stopPlay(); stepPrev(); }
  if (e.key === " ")          { e.preventDefault(); startPlay(); }
  if (e.key === "r" || e.key === "R") reset();
  if (e.key >= "1" && e.key <= "5") {
    stopPlay();
    activeMacro = parseInt(e.key) - 1;
    activeStep  = 0;
    buildTabs(); buildRail(); updateStepInfo(); drawScreen();
  }
});

// init sequence
buildTabs();
buildRail();

requestAnimationFrame(() => {
  resizeCanvas();
  updateStepInfo();
});
</script>
</body>
</html>
